[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mgit"
version = "0.1.4"
description = "CLI for managing multiple git repositories"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "treeparse",
    "rich",
    "pyyaml",
    "questionary",
    "loguru",
    "pyperclip",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[project.scripts]
mgit = "mgit.cli:main"

[tool.pytest.ini_options]
addopts = ""
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
